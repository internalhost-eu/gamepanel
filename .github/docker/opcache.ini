; OPcache tuning for production. The image ships immutable code, so timestamp
; validation is disabled (validate_timestamps=0) — a php-fpm reload is required
; to pick up code changes. save_comments must stay on: Laravel/Doctrine read
; attributes & annotations at runtime.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1
